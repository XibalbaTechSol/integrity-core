[project]
name = "integrity-cli"
version = "0.1.0"
description = "Developer CLI for the Integrity Protocol: agent identity, governance, and Oracle/BCC middleware access"
requires-python = ">=3.12"
dependencies = [
    # >=0.15 required for click >=8.2 compatibility: the web3/eth-account stack this
    # package's on-chain register flow depends on pulls in a newer click, and typer
    # <0.15 silently mis-parses options against click 8.2+ (options stop registering).
    "typer>=0.15.0",
    "rich>=13.7.0,<14.0.0",
    "httpx>=0.27.0",
    "cryptography>=50.0.0",
    "python-dotenv>=1.0.0",
    # EVM wallet + on-chain deploy/registration (wallet.py, chain.py) -- same
    # versions integrity-sdk depends on and has proven against real
    # contracts, kept in lockstep deliberately (see wallet.py/chain.py
    # module docstrings for why this CLI has its own copies of the logic
    # rather than importing integrity_sdk).
    "eth-account>=0.13.0",
    "web3>=7.4.0",
    "eth-utils>=5.1.0",
    "jcs>=0.2.1",
    # `hooks install`/`hooks uninstall` only: imports integrity_sdk.did for the
    # harness-root DID layout (public agent.did.json in the root, private key
    # outside it). This is a deliberate, narrow exception to this package's
    # longstanding no-SDK-import convention (see identity.py's module
    # docstring) -- that convention exists for the on-chain registration/
    # wallet code, decoupled from the SDK's own build order while both were in
    # flux; `hooks install`'s entire job is to install the SDK's own layout, so
    # reimplementing it a third time here would create exactly the "same name,
    # two DIDs" drift identity.py already warns about. Owner-approved
    # 2026-10-05. Base extra only -- requests/web3-backed connector code lives
    # in integrity_sdk.hook_runner (the SDK side this command's hooks invoke
    # out-of-process), never imported here.
    "integrity-sdk",
]

[project.scripts]
integrity = "integrity_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["integrity_cli"]

[tool.uv.sources]
integrity-sdk = { path = "../integrity-sdk", editable = true }

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-httpx>=0.30.0",
]
