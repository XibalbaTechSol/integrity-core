          items:
            type: string
          description: |-
            Per-outcome pari-mutuel pool, decimal strings, index = outcome index. Cheap
            public-getter reads (`outcomeStaked(i)`), unlike per-holder positions (see
            `MarketDetailDto`'s doc comment).
        question:
          type: string
        resolve_deadline:
          type: string
          format: date-time
        resolved:
          type: boolean
        total_staked:
          type: string
        winning_outcome:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
    OtelVolumeBucket:
      type: object
      required:
      - bucket_start
      - span_count
