          - string
          - 'null'
        created_at:
          type: string
        decision:
          type: string
        detail:
          type:
          - string
          - 'null'
        event_type:
          type: string
        id:
          type: string
        reason_code:
          type:
          - string
          - 'null'
        source:
          type: string
    AuditLogIngestRequest:
      type: object
      required:
      - source
      - event_type
      - decision
      properties:
        agent_id:
          type:
          - string
          - 'null'
        decision:
          type: string
        detail:
          type:
          - string
          - 'null'
        event_type:
          type: string
        intent_type:
          type:
          - string
          - 'null'
        metadata: {}
        reason_code:
          type:
          - string
          - 'null'
        source:
          type: string
    AuditLogIngestResponse:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
    BaaDto:
      type: object
      required:
      - address
      - covered_entity
      - business_associate
      - agreement_hash
      - required_collateral
      - status
      properties:
        address:
          type: string
        agreement_hash:
          type: string
        business_associate:
          type: string
        covered_entity:
          type: string
        required_collateral:
          type: string
          description: Decimal string, uint256 wei of $ITK (SmartBAA.requiredCollateral).
        status:
          type: string
          description: 'SmartBAA.Status: Proposed | Active | Disputed | Terminated.'
    BenchmarkDto:
      type: object
      description: Network-wide model/provider stability benchmark (aggregated telemetry per model).
      required:
      - model_name
      - provider_name
      - simulated_ais
      - stability_metric
      - grounding_metric
      - sample_count
      properties:
        grounding_metric:
          type: number
