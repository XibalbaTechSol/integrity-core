      - provider
      - nonce
      - assurance_profile
      - message_format
      - expires_at
      properties:
        agent_id:
          type: string
        assurance_profile:
          type: string
        expires_at:
          type: string
          format: date-time
        message_format:
          type: string
        nonce:
          type: string
        provider:
          type: string
    KycChecks:
