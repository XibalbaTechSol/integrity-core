openapi: 3.1.0
info:
  title: Integrity Protocol — AIS API
  description: Read-side wire protocol for querying an agent's Agent Integrity Score (AIS), on-chain primitive addresses, compliance status, market state, and wallet balances. This is the versioned, externally-supported surface — /v1/* is additive-only for its lifetime; any field rename, type change, or removal requires a /v2/* prefix. See spec/ais-api/v1/README.md for the integration guide and spec/ais-api/CHANGELOG.md for the version history.
  license:
    name: ''
  version: 1.0.0
paths:
  /v1/agent/register:
    post:
      tags:
      - agents
      summary: |-
        Registers an agent, but only after independently confirming on-chain that the
        primitives it claims actually belong to its DID. This is the crux of the
        self-sovereign model being honest end-to-end: without this check, `/v1/agent/register`
        would just be recording whatever the client says, and the entire "the chain is the
        source of truth" premise (§6) would be decorative.
      operationId: register_agent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterAgentRequest'
        required: true
      responses:
        '200':
          description: Agent registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterAgentResponse'
        '400':
          description: Bad request
        '409':
          description: Agent already registered
  /v1/agent/{id}:
    get:
      tags:
      - agents
      operationId: get_agent
      parameters:
      - name: id
        in: path
        description: Agent DID (`did:integrity:<fingerprint>`)
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Agent found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '404':
          description: Unknown DID
  /v1/agent/{id}/ais:
    get:
      tags:
      - ais
      operationId: get_ais
      parameters:
      - name: id
        in: path
        description: Agent DID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Current AIS (Agent Integrity Score) breakdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AisResponse'
        '404':
          description: Unknown DID
  /v1/agent/{id}/ais/history:
    get:
      tags:
      - ais
      operationId: get_ais_history
      parameters:
      - name: id
        in: path
        description: Agent DID
        required: true
        schema:
          type: string
      - name: bucket
        in: query
        description: 'One of: 5m, 15m, 1h, 6h, 1d, 1w (default 1h)'
        required: false
        schema:
          type: string
      - name: since
        in: query
        description: RFC3339 timestamp; default now - 7 days
        required: false
        schema:
          type: string
      responses:
        '200':
          description: AIS trend, bucketed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AisHistoryPoint'
        '400':
          description: Unsupported bucket value
        '404':
          description: Agent not found
  /v1/agent/{id}/baas:
    get:
      tags:
      - health
      operationId: get_agent_baas
      parameters:
      - name: id
        in: path
        description: Agent DID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: SmartBAA agreements where this agent is the business associate
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BaaDto'
  /v1/agent/{id}/compliance:
    get:
      tags:
      - compliance
      operationId: get_compliance
      parameters:
      - name: id
        in: path
        description: Agent DID
        required: true
        schema:
          type: string
      - name: covered_entity
        in: query
        description: Covered-entity address to check isHealthcareCompliant against
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Declared vertical + live compliance verdict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceResponse'
  /v1/agent/{id}/contracts:
    get:
      tags:
      - markets
      operationId: get_agent_contracts
      parameters:
      - name: id
        in: path
        description: Agent DID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: IntegrityMarket contracts this agent deployed and owns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarketSummaryDto'
  /v1/agent/{id}/credit:
    get:
      tags:
      - agent
      operationId: get_credit
      parameters:
      - name: id
        in: path
        description: Agent DID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The agent's aggregated A2ACapitalPool position
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditDto'
  /v1/agent/{id}/events:
    get:
      tags:
      - telemetry
      operationId: get_agent_events
      parameters:
      - name: id
        in: path
        description: Agent DID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Recent structured events from vendor OTLP logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentEventDto'
  /v1/agent/{id}/handle:
    get:
      tags:
      - identity
      operationId: get_agent_handle
      parameters:
      - name: id
        in: path
        description: Agent DID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Primary XNS handle for the agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentHandleDto'
  /v1/agent/{id}/otel/traces:
    get:
      tags:
      - telemetry
      operationId: get_recent_traces
      parameters:
      - name: id
        in: path
        description: Agent DID
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: Max traces to return (default 20)
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Recent trace_ids for this agent (one row per root span, most recent first) — the list-discovery endpoint `GET /v1/traces/{trace_id}` itself never provided.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecentTraceDto'
  /v1/agent/{id}/otel/volume:
    get:
      tags:
      - telemetry
      operationId: get_otel_volume
      parameters:
      - name: id
        in: path
        description: Agent DID
        required: true
        schema:
          type: string
      - name: bucket
        in: query
        description: 'One of: 5m, 15m, 1h, 6h, 1d, 1w (default 1h)'
        required: false
        schema:
          type: string
      - name: since
        in: query
        description: RFC3339 timestamp; default now - 7 days
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Real OTLP span volume, bucketed. Unauthenticated data source (see otlp.rs) — no 404 on an unknown agent_id, since one was never required to exist.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OtelVolumeBucket'
  /v1/agent/{id}/provenance:
    get:
      tags:
      - audit
      operationId: get_provenance
      parameters:
      - name: id
        in: path
        description: Agent DID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The agent's on-chain-anchored provenance chain
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProvenanceEntryDto'
  /v1/agent/{id}/stake:
    get:
      tags:
      - agent
      operationId: get_stake
      parameters:
      - name: id
        in: path
        description: Agent DID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The agent's on-chain stake accounting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StakeDto'
  /v1/agent/{id}/telemetry:
    get:
      tags:
      - agents
      operationId: get_telemetry_history
      parameters:
      - name: id
        in: path
        description: Agent DID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: List of telemetry events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TelemetryEventDetailDto'
        '404':
          description: Agent not found
  /v1/agent/{id}/telemetry/volume:
    get:
      tags:
      - telemetry
      operationId: get_telemetry_volume
      parameters:
      - name: id
        in: path
        description: Agent DID
        required: true
        schema:
          type: string
      - name: bucket
        in: query
        description: 'One of: 5m, 15m, 1h, 6h, 1d, 1w (default 1h)'
        required: false
        schema:
          type: string
      - name: since
        in: query
        description: RFC3339 timestamp; default now - 7 days
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Signed telemetry ingest volume, bucketed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VolumeBucket'
        '400':
          description: Unsupported bucket value
        '404':
          description: Agent not found
  /v1/agent/{id}/traces:
    get:
      tags:
      - agents
      operationId: get_traces
      parameters:
      - name: id
        in: path
        description: Agent DID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: List of judge evaluations/traces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentJudgeEvaluationDto'
        '404':
          description: Agent not found
  /v1/agent/{id}/usage:
    get:
      tags:
      - telemetry
      operationId: get_agent_usage
      parameters:
      - name: id
        in: path
        description: Agent DID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Token/cost rollup from vendor OTLP metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentUsageDto'
  /v1/agent/{id}/verify/kyc:
    post:
      tags:
      - verification
      summary: |-
        Verify and persist a minimal KYC receipt. No raw identity attributes enter this
        handler: the provider-local opaque reference is the only subject identifier stored.
      operationId: verify_kyc_receipt
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KycReceipt'
        required: true
      responses:
        '200':
          description: Trusted KYC receipt verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationResponse'
        '400':
          description: Receipt rejected
        '404':
          description: Agent not found
  /v1/agent/{id}/verify/kyc/challenge:
    post:
      tags:
      - verification
      summary: |-
        Issue a nonce for a trusted KYC verifier. The verifier may be a self-hosted
        open-source deployment; authority comes from its operator-configured signing key,
        not from a client claiming that checks ran.
      operationId: request_kyc_challenge
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KycChallengeRequest'
        required: true
      responses:
        '200':
          description: KYC receipt challenge issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycChallengeResponse'
        '400':
          description: Provider is not trusted
        '404':
          description: Agent not found
  /v1/agent/{id}/wallet:
    get:
      tags:
      - wallet
      operationId: get_wallet
      parameters:
      - name: id
        in: path
        description: Agent DID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: $ITK balance + open market positions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletResponse'
        '404':
          description: Unknown DID
  /v1/agents:
    get:
      tags:
      - agents
      operationId: list_agents
      responses:
        '200':
          description: All registered agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentSummary'
  /v1/audit-log:
    get:
      tags:
      - audit
      summary: |-
        Merges three real event streams into one time-ordered feed -- the genuine
        "everything logged" table a manual-debugging view needs, not just policy
        decisions: `audit_log` (BCC intercept decisions -- the only source with an
        explicit allow/deny verdict), `telemetry_events` (SDK-submitted telemetry,
        surfaced as "flagged"/"recorded" so a compliance operator sees
        signature-verified-but-suspicious submissions alongside policy denials),
        and `otel_spans` (every real span, flat, `decision` repurposed as the
        span's own real status_code). Merged in Rust rather than a single SQL
        UNION because the three source tables don't share a column shape and
        coercing them into one query would obscure more than it saves — see each
        table's own migration for why they're separate to begin with. The
        telemetry_events and otel_spans sides only mix in when `agent_id` is
        given: neither table has an existing "recent across all agents" query
        (both underlying db:: functions are always agent-scoped), so the global
        feed (no agent_id) is audit_log only rather than paying for a new
        unscoped scan just for this one aggregate view.
      operationId: get_audit_log
      parameters:
      - name: agent_id
        in: query
        description: Filter to one agent's DID; omit for the global feed
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Max entries per source table before merging (default 100)
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Real, time-ordered log merging BCC decisions, SDK telemetry, and OTel spans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLogEntryDto'
  /v1/audit/anchor:
    post:
      tags:
      - audit
      operationId: ingest_anchor_events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnchorEventIngestRequest'
        required: true
      responses:
        '200':
          description: Anchor events recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnchorEventIngestResponse'
  /v1/audit/effect:
    post:
      tags:
      - audit
      operationId: submit_audit_effect
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditEffectRequest'
        required: true
      responses:
        '200':
          description: Effect report recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEffectResponse'
  /v1/audit/ingest:
    post:
      tags:
      - audit
      operationId: ingest_audit_log
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditLogIngestRequest'
        required: true
      responses:
        '200':
          description: Audit event recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogIngestResponse'
  /v1/audit/intent/{intended_state_hash}:
    get:
      tags:
      - audit
      operationId: get_audit_intent_join
      parameters:
      - name: intended_state_hash
        in: path
        description: The intent commitment's intended_state_hash
        required: true
        schema:
          type: string
      responses:
        '200':
          description: All audit_log rows sharing this intended_state_hash (the original intent row plus any posttool_effect reports)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEffectJoinResponse'
  /v1/audit/invocation/{invocation_id}:
    get:
      tags:
      - audit
      operationId: get_audit_invocation_join
      parameters:
      - name: invocation_id
        in: path
        description: Canonical invocation UUID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Audit rows for exactly one attempted action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditInvocationJoinResponse'
  /v1/benchmarks:
    get:
      tags:
      - ais
      operationId: get_benchmarks
      responses:
        '200':
          description: Model/provider stability benchmarks (network-wide telemetry aggregate)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BenchmarkDto'
  /v1/governance/proposals:
    get:
      tags:
      - governance
      operationId: get_governance_proposals
      responses:
        '200':
          description: IntegrityGovernance proposals (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProposalDto'
  /v1/leaderboard:
    get:
      tags:
      - ais
      operationId: get_leaderboard
      responses:
        '200':
          description: Agents ranked by on-chain ReputationRegistry.effectiveScore
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeaderboardEntryDto'
  /v1/markets:
    get:
      tags:
      - markets
      operationId: list_markets
      responses:
        '200':
          description: All known IntegrityMarket instances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarketSummaryDto'
  /v1/markets/{id}:
    get:
      tags:
      - markets
      operationId: get_market
      parameters:
      - name: id
        in: path
        description: IntegrityMarket contract address
        required: true
        schema:
          type: string
      - name: agent
        in: query
        description: SovereignAgent address to include a your_position read for
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Market detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketDetailDto'
        '400':
          description: Invalid address / no readable IntegrityMarket at that address
  /v1/shield/unregistered-agents:
    get:
      tags:
      - audit
      operationId: get_unregistered_agents
      responses:
        '200':
          description: DIDs with telemetry/audit evidence but no agent registration
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UnregisteredAgentDto'
  /v1/stats:
    get:
      tags:
      - ais
      operationId: get_stats
      responses:
        '200':
          description: Protocol-wide singleton aggregates (marketplace + capital pool)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsDto'
  /v1/telemetry/ingest:
    post:
      tags:
      - telemetry
      operationId: ingest_telemetry
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryIngestRequest'
        required: true
      responses:
        '200':
          description: Event ingested and Merkle-leafed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryIngestResponse'
        '400':
          description: Bad request / PHI detected in payload
        '401':
          description: Signature verification failed
        '404':
          description: Unknown agent
        '409':
          description: Nonce replay
        '429':
          description: Rate limited
  /v1/traces/{trace_id}:
    get:
      tags:
      - telemetry
      operationId: get_trace_tree
      parameters:
      - name: trace_id
        in: path
        description: OTLP trace ID (hex)
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Nested span tree for this trace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceTreeResponse'
        '404':
          description: No spans found for this trace_id — unauthenticated data source (see otlp.rs), so this just means nothing was ever ingested under that ID, not that access was denied
  /v1/xns/resolve:
    get:
      tags:
      - identity
      operationId: get_xns_resolve
      parameters:
      - name: handle
        in: path
        description: Human-readable handle to resolve (without a leading @), e.g. "atlas".
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Resolve an XNS handle to its SovereignAgent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XnsResolveDto'
components:
  schemas:
    AgentEventDto:
      type: object
      required:
      - attributes
      - time
      - evidence_tier
      properties:
        attributes: {}
        body:
          type:
          - string
          - 'null'
        event_name:
          type:
          - string
          - 'null'
        evidence_tier:
          type: string
        severity_text:
          type:
          - string
          - 'null'
        span_id:
          type:
          - string
          - 'null'
        time:
          type: string
          format: date-time
        trace_id:
          type:
          - string
          - 'null'
    AgentHandleDto:
      type: object
      required:
      - did
      properties:
        did:
          type: string
        handle:
          type:
          - string
          - 'null'
          description: Primary handle registered for this agent's SovereignAgent, or null if none.
    AgentJudgeEvaluationDto:
      type: object
      required:
      - id
      - agent_id
      - run_id
      - judge_model
      - verdict
      - created_at
      properties:
        agent_id:
          type: string
        created_at:
          type: string
        id:
          type: string
          format: uuid
        judge_model:
          type: string
        rationale_summary:
          type:
          - string
          - 'null'
        run_id:
          type: string
        score:
          type:
          - number
          - 'null'
          format: double
        telemetry_event_id:
          type:
          - string
          - 'null'
          format: uuid
        verdict:
          type: string
    AgentResponse:
      type: object
      required:
      - id
      - verification_tier
      - last_nonce
      - created_at
      - has_ed25519_key
      - has_eth_address
      - oracle_registered
      - primitives_source
      properties:
        created_at:
          type: string
          format: date-time
        did_document:
          description: |-
            §4.1 DID Document, as supplied on `POST /v1/agent/register`. `None` for agents that
            registered before this field existed, or that were only ever seen via a chain
            backfill (see the "chain-backfill"/"unavailable" `primitives_source` cases below,
            which synthesize a response with no local `agents` row at all).
        has_ed25519_key:
          type: boolean
        has_eth_address:
          type: boolean
        id:
          type: string
        last_nonce:
          type: integer
          format: int64
        oracle_registered:
          type: boolean
          description: |-
            True only when this DID has a real row in this oracle's own `agents` table (a real
            `POST /v1/agent/register` call against THIS oracle, at some point in its history).
            **Not** the same question as "does this DID exist" — a DID that resolves live on-chain
            (see `primitives_source: "chain-backfill"` below) but was never registered against
            this specific oracle instance still returns `200` here with `oracle_registered: false`,
            a synthesized `id`/`primitives` and no other real fields. Added because that
            distinction was previously only inferable by checking `primitives_source != "cache"`
            AND `has_ed25519_key`/`has_eth_address`, which every caller had to reverse-engineer —
            `GET /v1/telemetry/ingest` and `GET /v1/agent/{id}/ais` both fail closed
            (`AgentNotFound`) on exactly this same local-row check (`db::get_agent`), so a caller
            deciding "is it safe/worthwhile to send telemetry for this agent" needs this exact
            boolean, not "does the DID exist anywhere."
        primitives:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/PrimitiveSetDto'
        primitives_source:
          type: string
          description: |-
            True when this response's `primitives` came from a live chain read performed just
            now (cache miss / no local `agents` row), rather than the Postgres cache.
        verification_tier:
          type: integer
          format: int32
          description: |-
            Effective server-verified tier: registration floor unioned with active, unexpired,
            unrevoked DNS/GitHub/Nitro evidence. Scoring-core uses it as the identity ceiling,
            and BCC policy additionally requires minimum tiers for sensitive intent types.
    AgentSummary:
      type: object
      required:
      - id
      - verification_tier
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
        erc8004_binding_status:
          type:
          - string
          - 'null'
          description: |-
            `"verified"` / `"stale"` / `"transfer_conflict"`, or `None` if this agent has no
            ERC-8004 binding on record. A directory filtering on this must never treat `None`
            as untrustworthy — most agents simply haven't linked a public listing.
        handle:
          type:
          - string
          - 'null'
          description: |-
            The agent's primary XNS handle (e.g. `"xibalba.integrity"`), read live from
            `XibalbaNameService.primaryHandle(sovereignAgent)`. This is the protocol's own
            naming authority — self-service and on-chain (see XibalbaNameService.sol's NatSpec
            on why there is deliberately no privileged off-chain registrar) — so consumers
            should prefer it over `name` when displaying an agent.

            `None` is a normal, expected outcome, never an error: the agent hasn't claimed a
            handle, XNS isn't deployed on this chain, or the on-chain read failed. See
            `list_agents` on why a chain hiccup must not take the whole fleet list down.
        id:
          type: string
        name:
          type:
          - string
          - 'null'
          description: |-
            Legacy secondary display name, if the agent's DID document carries an `alsoKnownAs`
            entry. Kept as a last-resort fallback below `handle` — most agents have none, and
            nothing in this system can write it (`register_agent` is an insert with no update
            path), so new naming should go through XNS.
        verification_tier:
          type: integer
          format: int32
    AgentUsageDto:
      type: object
      description: |-
        Default lookback window when `since` isn't given: 7 days, distinct from
        `compute_ais_for_agent`'s 30-day (`AIS_REPORTING_PERIOD_DAYS`) scoring window — the
        two are read for different purposes (a chart's default view vs. the score itself)
        and don't need to share a constant.
        Token and cost rollup for an agent, from the OTLP metrics receiver (`otel_metrics`).

        `tokens` is keyed by the emitter's token `type` attribute, so Claude Code yields
        `input` / `output` / `cacheRead` / `cacheCreation` — the breakdown the signed telemetry
        path cannot supply, since providers report cache and reasoning tokens only in their own
        usage objects.
      required:
      - agent_id
      - tokens
      - total_tokens
      - cost_usd_by_model
      - total_cost_usd
      - evidence_tier
      - since
      properties:
        agent_id:
          type: string
        cost_usd_by_model:
          type: object
          description: model -> summed reported cost in USD.
          additionalProperties:
            type: number
            format: double
          propertyNames:
            type: string
        evidence_tier:
          type: string
          description: |-
            Always `"unsigned_vendor"`. This data arrives over the UNAUTHENTICATED OTLP port and
            carries no agent signature, so it is deliberately NOT an AIS input — it is reported
            here for observability and for cross-checking what an agent signs against what its
            runtime reports. Surfaced in the response so a consumer cannot mistake it for
            agent-attested evidence.
        since:
          type: string
          format: date-time
        tokens:
          type: object
          description: token type -> summed count over the window.
          additionalProperties:
            type: number
            format: double
          propertyNames:
            type: string
        total_cost_usd:
          type: number
          format: double
        total_tokens:
          type: number
          format: double
    AisComponents:
      type: object
      required:
      - entropy
      - grounding
      - sacrifice
      - compliance
      properties:
        compliance:
          type: number
          format: double
        entropy:
          type: number
          format: double
        grounding:
          type: number
          format: double
        sacrifice:
          type: number
          format: double
    AisHistoryPoint:
      type: object
      required:
      - bucket_start
      - ais
      - entropy
      - grounding
      - sacrifice
      - compliance
      - zk_boost
      - event_count
      properties:
        ais:
          type: number
          format: double
        bucket_start:
          type: string
          format: date-time
        compliance:
          type: number
          format: double
        entropy:
          type: number
          format: double
        event_count:
          type: integer
          format: int64
        grounding:
          type: number
          format: double
        sacrifice:
          type: number
          format: double
        zk_boost:
          type: number
          format: double
    AisResponse:
      type: object
      required:
      - agent_id
      - ais
      - components
      - weights
      - zk_boost
      - zk_proof_verified
      - period_start
      - period_end
      - event_count
      - anchor_coverage
      - constraint_score
      - shadow_gate
      properties:
        agent_id:
          type: string
        ais:
          type: number
          format: double
        anchor_coverage:
          $ref: '#/components/schemas/AnchorCoverage'
          description: |-
            Whether this agent's on-chain `StateAnchor` shows anchoring activity at or after
            `period_start`, given it had telemetry activity in that same window.
            Informational only (see `anchor_coverage.rs`) — never fed into `ais` itself.
        components:
          $ref: '#/components/schemas/AisComponents'
        constraint_score:
          type: number
          format: double
          description: |-
            spec/integrity-protocol-v3.2.md §3.1.1 eq. 4b's `r(ι)`: the normalised, pre-boost,
            tier-ceilinged constraint input in `[0,1]`. Distinct from `ais` above (post-boost,
            unclamped, display-only) — any integration reading a reputation-parameterised bound
            off this response MUST use this field, never `ais`. See `AisBreakdown`'s doc comment.
        event_count:
          type: integer
          format: int64
        onchain_zk_boost_consistent:
          type:
          - boolean
          - 'null'
          description: |-
            Present only when a cached on-chain ReputationRegistry address is known for this
            agent — a nice-to-have cross-check (per the task's "not required" note) that the
            oracle's off-chain `zk_verified_this_period` telemetry flag agrees with the
            contract's own independently-earned `isZkBoosted` state. A mismatch here doesn't
            fail the request (the two are allowed to be transiently out of sync — e.g. a proof
            submitted directly to the contract that hasn't shown up in telemetry yet) but is
            worth surfacing to an operator.
        period_end:
          type: string
          format: date-time
        period_start:
          type: string
          format: date-time
        shadow_gate:
          $ref: '#/components/schemas/ShadowGate'
          description: |-
            **Shadow-mode only** (spec §3.1.4 row 5, `PRODUCTION_GAPS.md` §27) — reports what
            the proposed per-component floor + conjunctive gate would decide, using this
            oracle's currently-configured `AisFloors` (provisional defaults unless an operator
            has overridden them). Purely observational: does not affect `ais` or
            `constraint_score`, does not gate anything, and is not consumed by
            `bcc_middleware`'s chain-push or dispute logic.
        weights:
          $ref: '#/components/schemas/AisWeightsSchema'
        zk_boost:
          type: number
          format: double
        zk_proof_verified:
          type: boolean
    AisWeightsSchema:
      type: object
      description: |-
        Schema-only mirror of `scoring_core::AisWeights` for OpenAPI generation.
        `scoring-core` is deliberately dependency-free beyond `serde` (see its Cargo.toml —
        it's the single source of truth for the AIS formula and must stay trivially
        auditable), so it doesn't derive `utoipa::ToSchema` itself. This struct's fields
        must stay in sync with `scoring_core::AisWeights` by hand; a `scoring_core` unit
        test pinning its `Serialize` output's field names is the backstop against drift
        (see scoring-core's existing `default_weights_sum_to_one` test module).
      required:
      - w_entropy
      - w_grounding
      - w_sacrifice
      - w_compliance
      properties:
        w_compliance:
          type: number
          format: double
        w_entropy:
          type: number
          format: double
        w_grounding:
          type: number
          format: double
        w_sacrifice:
          type: number
          format: double
    AllowanceDto:
      type: object
      required:
      - agent
      - limit
      - spent
      - status
      properties:
        agent:
          type: string
        limit:
          type: string
        spent:
          type: number
          format: double
        status:
          type: string
    AnchorCoverage:
      type: object
      required:
      - status
      - events_in_period
      properties:
        events_in_period:
          type: integer
          format: int64
        last_anchored_at:
          type:
          - string
          - 'null'
          format: date-time
          description: |-
            `None` if the on-chain read failed (RPC unreachable, bad address) or the
            `StateAnchor` has never anchored anything (`latestEpoch == 0`) — indistinguishable
            from each other at this layer, both surfaced as "we don't know," never coerced
            into a false `Stale` or `Current`.
        last_anchored_epoch:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        status:
          $ref: '#/components/schemas/AnchorCoverageStatus'
    AnchorCoverageStatus:
      type: string
      enum:
      - no_activity
      - current
      - stale
    AnchorEventIngestRequest:
      type: object
      required:
      - agent_id
      - leaves
      - root
      - tx_hash
      properties:
        agent_id:
          type: string
        leaves:
          type: array
          items:
            type: string
          description: 0x-prefixed keccak256 Merkle leaves that were committed in this anchor tx.
        root:
          type: string
          description: 0x-prefixed per-agent sub-tree root anchored on-chain.
        tx_hash:
          type: string
          description: On-chain StateAnchor.anchorRoot transaction hash.
    AnchorEventIngestResponse:
      type: object
      required:
      - recorded
      properties:
        recorded:
          type: integer
          format: int64
          description: Rows inserted (leaves already recorded are skipped idempotently).
          minimum: 0
    AuditEffectJoinResponse:
      type: object
      required:
      - intended_state_hash
      - rows
      properties:
        intended_state_hash:
          type: string
        rows:
          type: array
          items:
            $ref: '#/components/schemas/AuditEffectJoinRow'
    AuditEffectJoinRow:
      type: object
      description: |-
        BCC intent-vs-effect join (~/.claude/plans/velvet-giggling-quill.md): both the original
        ALLOW row (written with `intended_state_hash` in its metadata, see /v1/audit/ingest) and
        any `posttool_effect` row(s) reporting an actual effect hash against it (see
        `submit_audit_effect`) share the same `intended_state_hash` value inside their JSONB
        `metadata` -- there's no dedicated column for it (see this session's own earlier
        investigation: it lives only in the blob), so this queries the JSONB field directly
        (`metadata->>'intended_state_hash' = $1`) rather than requiring a migration. `AuditLogRow`
        doesn't carry `metadata` (it's a read DTO shaped for the dashboard's audit panel), so this
        returns a lighter-weight row that does, since inspecting the metadata IS the point here.
      required:
      - id
      - event_type
      - decision
      - metadata
      - created_at
      properties:
        agent_id:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        decision:
          type: string
        event_type:
          type: string
        id:
          type: string
          format: uuid
        metadata: {}
    AuditEffectRequest:
      type: object
      required:
      - agent_id
      - invocation_id
      - intended_state_hash
      - effect_hash
      - matches
      properties:
        agent_id:
          type: string
        effect_hash:
          type: string
        intended_state_hash:
          type: string
        invocation_id:
          type: string
          format: uuid
        matches:
          type: boolean
    AuditEffectResponse:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
    AuditInvocationJoinResponse:
      type: object
      required:
      - invocation_id
      - rows
      properties:
        invocation_id:
          type: string
          format: uuid
        rows:
          type: array
          items:
            $ref: '#/components/schemas/AuditEffectJoinRow'
    AuditLogEntryDto:
      type: object
      required:
      - id
      - source
      - event_type
      - decision
      - created_at
