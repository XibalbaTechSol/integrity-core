    PrimitiveSetDto:
      type: object
      description: |-
        Wire shape for the 7-address PrimitiveSet (§6.1), matching
        `integrity-dashboard/src/lib/api/types.ts`'s `PrimitiveSet` field-for-field (camelCase)
        so the dashboard can deserialize this oracle's responses without a translation layer.
      required:
      - sovereign_agent
      - state_anchor
      - reputation_registry
      - slasher
      - verifier_registry
      - compliance_gate
      - agent_profile
      properties:
        agent_profile:
          type: string
        compliance_gate:
          type: string
        reputation_registry:
          type: string
        slasher:
          type: string
        sovereign_agent:
          type: string
        state_anchor:
          type: string
        verifier_registry:
          type: string
    ProposalDto:
      type: object
      required:
      - id
      - proposer
      - target
      - value
      - start_time
      - end_time
      - eta
      - for_votes
      - against_votes
      - state
      - description
      properties:
        against_votes:
          type: string
          description: Decimal string, wei of ITK locked AGAINST.
        description:
          type: string
        end_time:
          type: integer
          format: int64
          minimum: 0
        eta:
          type: integer
          format: int64
          description: Timelock ETA (unix seconds); 0 until queued.
          minimum: 0
        for_votes:
          type: string
          description: Decimal string, wei of ITK locked FOR.
        id:
          type: integer
          format: int64
          minimum: 0
        proposer:
          type: string
        start_time:
          type: integer
          format: int64
          minimum: 0
        state:
          type: string
          description: Active | Defeated | Succeeded | Queued | Executed | Expired | Canceled.
        target:
          type: string
        value:
          type: string
          description: Decimal string, uint256 wei of native value the action would send (usually "0").
    ProvenanceEntryDto:
      type: object
      required:
      - id
      - agent_id
      - leaf
      - root
      - tx_hash
      - anchored_at
      properties:
        agent_id:
          type: string
        anchored_at:
          type: string
        created_at:
          type:
          - string
          - 'null'
        decision:
          type:
          - string
          - 'null'
          description: The policy decision that produced the leaf (allow / shadow_deny / …), if joined.
        id:
          type: string
        intent_type:
          type:
          - string
          - 'null'
          description: |-
            The committed intent type (the "action"), when the anchored leaf joins to
            an audit_log decision row.
        leaf:
          type: string
          description: 0x keccak Merkle leaf of the committed intent (the provenance input hash).
        root:
          type: string
          description: 0x per-agent StateAnchor root the leaf was committed under.
        tx_hash:
          type: string
          description: On-chain StateAnchor.anchorRoot transaction hash.
    RecentTraceDto:
      type: object
      required:
      - trace_id
      - name
      - start_time
      properties:
        name:
          type: string
        start_time:
          type: string
        trace_id:
          type: string
    RegisterAgentRequest:
      type: object
      required:
      - did
      - did_document
      - primitives
      properties:
        did:
          type: string
          description: |-
            `did:integrity:<fingerprint>` — the agent's canonical off-chain identifier and
            the primary key of the `agents` table.
        did_document:
          description: |-
            §4.1 DID Document. Stored verbatim in the response for now (no dedicated column —
            see README/gaps note); its `verificationMethod` is where `ed25519_pubkey_hex`
            below is expected to have come from, but this handler trusts the explicit field,
            not a parse of the document, to avoid a second, redundant multibase-decode path.
        ed25519_pubkey_hex:
          type:
          - string
          - 'null'
        eth_address_hex:
          type:
          - string
          - 'null'
        primitives:
          $ref: '#/components/schemas/PrimitiveSetDto'
          description: |-
            The 7 on-chain primitive addresses the client claims it registered via
            `AgentPrimitivesFactory`. Independently re-verified against
            `XibalbaAgentRegistry.resolveDID` below — never trusted as-is (see chain.rs's
            module doc comment for why).
        verification_tier:
          type: integer
          format: int32
          description: |-
            ADVISORY ONLY — never trusted. A previous version of this handler stored this
            client-supplied value directly, which meant any client could self-assert
            `verification_tier: 3` at registration with nothing server-side checking the
            claim, defeating the entire point of a verification ladder (see
            docs/wiki/concepts/identity-ceiling.md). `register_agent` now always computes
            the real, server-verified tier itself (see that function) and ignores this
            field; it's kept on the wire only for backward request-shape compatibility.
    RegisterAgentResponse:
      type: object
      required:
      - id
      - verification_tier
      - primitives
      - controller
      - domain_id
      properties:
        controller:
          type: string
        domain_id:
          type: string
        id:
          type: string
        primitives:
          $ref: '#/components/schemas/PrimitiveSetDto'
        verification_tier:
          type: integer
          format: int32
    ShadowGate:
      type: object
      required:
      - entropy_pass
      - grounding_pass
      - compliance_pass
      - would_pass
      properties:
        compliance_pass:
          type: boolean
        entropy_pass:
          type: boolean
        grounding_pass:
          type: boolean
        would_pass:
          type: boolean
    SpanTreeNode:
      type: object
      required:
      - id
      - agent_id
      - span_id
      - name
      - kind
      - status_code
      - start_time
      - end_time
      - duration_ms
      - attributes
      - children
      properties:
        agent_id:
          type: string
        attributes: {}
        children:
          type: array
          items:
            $ref: '#/components/schemas/SpanTreeNode'
          description: |-
            `no_recursion`: `SpanTreeNode` is self-referential (a node's children are more
            nodes) — without this, utoipa's schema builder recurses into its own field
            type with no cycle-breaking and stack-overflows at `gen_openapi` runtime. This
            only affects generated OpenAPI *documentation* depth, not actual serialization
            (`Vec<SpanTreeNode>` still holds real, arbitrarily-nested data at runtime) or
            the `MAX_TREE_DEPTH` recursion guard in `build_tree`, which is unrelated and
            still fully enforced.
        duration_ms:
          type: integer
          format: int64
          description: |-
            Always >= 0: `end_time` before `start_time` (a malformed/adversarial span) is
            clamped to 0 rather than surfacing a negative duration to callers.
        end_time:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        kind:
          type: string
        name:
          type: string
        span_id:
          type: string
        start_time:
          type: string
          format: date-time
        status_code:
          type: string
    StakeDto:
      type: object
      required:
      - agent_id
      - total_stake
      - locked_stake
      - available_stake
      - open_disputes
      properties:
        agent_id:
          type: string
        available_stake:
          type: string
        locked_stake:
          type: string
        open_disputes:
          type: integer
          format: int64
          description: |-
            Count of the agent's currently-open (unresolved) slashing disputes. The
            dashboard sums this across its agent loop for a real protocol-wide
            `active_disputes` with no extra fan-out (Slashers are per-agent clones with
            no singleton dispute index) — see docs/design/dashboard-wiring.md.
          minimum: 0
        total_stake:
          type: string
    StatsDto:
      type: object
      required:
      - market_count
      - total_marketplace_volume
      - escrowed_credit
      - released_credit
      - allocation_count
      properties:
        allocation_count:
          type: integer
          format: int64
          description: 'A2ACapitalPool: number of allocations scanned.'
          minimum: 0
        escrowed_credit:
          type: string
          description: 'A2ACapitalPool: capital currently escrowed (live available lines) across all agents.'
        market_count:
          type: integer
          format: int64
          description: Number of prediction markets in the cached index.
          minimum: 0
        released_credit:
          type: string
          description: |-
            A2ACapitalPool: capital disbursed ("borrowed") across all agents — the real
            `total_loans_volume`.
        total_marketplace_volume:
          type: string
          description: Sum of `total_staked` across every market (pari-mutuel volume).
    TelemetryEventDetailDto:
      type: object
      required:
      - id
      - agent_id
      - nonce
      - performance_variance
      - hgi_raw
      - gpu_hours_verified
      - flagged
      - zk_verified
      - leaf_hash
      - payload
      - created_at
      properties:
        agent_id:
          type: string
        created_at:
          type: string
        flagged:
          type: boolean
        gpu_hours_verified:
          type: number
          format: double
        hgi_raw:
          type: number
          format: double
        id:
          type: string
          format: uuid
        leaf_hash:
          type: string
        leaf_index:
          type:
          - integer
          - 'null'
          format: int32
          description: Always `null` today — see `merkle_root_id`'s doc comment.
        merkle_root_id:
          type:
          - string
          - 'null'
          format: uuid
          description: |-
            Always `null` today — see `db::fetch_pending_leaves`'s doc comment. Real Merkle
            anchoring for this event's leaf happens out-of-band, per-agent, in
            `bcc_middleware/app/anchor.py`, not via a root assigned back onto this row.
        nonce:
          type: integer
          format: int64
        payload: {}
        performance_variance:
          type: number
          format: double
        zk_verified:
          type: boolean
    TelemetryIngestRequest:
      type: object
      required:
      - agent_id
      - nonce
      - derived_signals
      - signature
      properties:
        agent_id:
          type: string
        derived_signals:
          $ref: '#/components/schemas/DerivedSignals'
        judge_evaluation:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/JudgeEvaluationDto'
            description: |-
              See `JudgeEvaluationDto`'s doc comment: optional, unauthenticated sidecar, not part
              of the signed envelope.
        nonce:
          type: integer
          format: int64
        otel_spans:
          type: array
          items: {}
        schema_version:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Version of the signed envelope. Inside the signed object, so it cannot be rewritten
            in transit to make this handler reinterpret a payload under different rules.

            `None` means the pre-versioning shape, which stays valid forever — signed payloads
            are evidence and old evidence must remain verifiable. Critically, the signable bytes
            are rebuilt WITHOUT the key when this is `None`: serializing it as `null` would
            change the canonical JSON and break every historical signature.
        signature:
          type: string
          description: |-
            Hex signature over the canonical JSON (see `crypto::canonical_json_bytes`) of every
            field above EXCEPT this one and `judge_evaluation` — i.e. the client constructs the
            object without `signature`, canonicalizes+signs that, then adds this field before
            POSTing. This mirrors the §4.2 BCC Commitment convention (sign the payload minus the
            signature field itself) rather than inventing a different scheme for telemetry.
        zk_proof:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ZkProofDto'
    TelemetryIngestResponse:
      type: object
      required:
      - event_id
      - leaf_hash
      - zk_verified
      - flagged
      properties:
        event_id:
          type: string
          format: uuid
        flagged:
          type: boolean
        leaf_hash:
          type: string
        zk_verified:
          type: boolean
    TraceTreeResponse:
      type: object
      required:
      - trace_id
      - span_count
      - truncated
      - roots
      properties:
        roots:
          type: array
          items:
            $ref: '#/components/schemas/SpanTreeNode'
        span_count:
          type: integer
          minimum: 0
        trace_id:
          type: string
        truncated:
          type: boolean
          description: |-
            True if the deepest branch was cut off (see `trace_tree::MAX_TREE_DEPTH`) —
            an honest signal that this isn't the complete tree, never silently dropped.
    TransactionDto:
      type: object
      required:
      - id
      - type
      - asset
      - amount
      - agent
      - status
      - time
      properties:
        agent:
          type: string
        amount:
          type: string
        asset:
          type: string
        id:
          type: string
        status:
          type: string
        time:
          type: string
        type:
          type: string
        usd:
          type:
          - string
          - 'null'
    UnregisteredAgentDto:
      type: object
      description: |-
        Real "shadow AI" discovery (Shield vertical): DIDs the oracle has telemetry/policy
        evidence for (`otel_spans`, `audit_log`) but that never registered via
        `POST /v1/agent/register`. See `db::list_unregistered_agents`'s doc comment for why
        this is the correctly-scoped, zero-new-infra version of this feature rather than
        literal network/process scanning (out of scope for a web app regardless).
      required:
      - agent_id
      - source
      - first_seen
      properties:
        agent_id:
          type: string
        first_seen:
          type: string
        source:
          type: string
          description: '"otel" | "audit_log" — which table this DID was first observed in.'
    VerificationResponse:
      type: object
      required:
      - agent_id
      - method
      - subject
      - tier_granted
      - effective_tier
      properties:
        agent_id:
          type: string
        effective_tier:
          type: integer
          format: int32
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        method:
          type: string
        subject:
          type: string
        tier_granted:
          type: integer
          format: int32
    VolumeBucket:
      type: object
      required:
      - bucket_start
      - count
      - flagged_count
      properties:
        bucket_start:
          type: string
          format: date-time
        count:
          type: integer
          format: int64
        flagged_count:
          type: integer
          format: int64
    WalletPositionDto:
      type: object
      required:
      - market_address
      - question
      - outcome_index
      - amount
      - market_resolved
      properties:
        amount:
          type: string
        market_address:
          type: string
        market_resolved:
          type: boolean
        outcome_index:
          type: integer
          format: int32
          minimum: 0
        question:
          type: string
        won:
          type:
          - boolean
          - 'null'
          description: '`Some(bool)` only once the market has resolved; `None` while still open.'
    WalletResponse:
      type: object
      required:
      - agent_id
      - sovereign_agent
      - itk_balance
      - open_positions
      properties:
        agent_id:
          type: string
        allowances:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AllowanceDto'
        itk_balance:
          type: string
          description: Real `IntegrityToken.balanceOf(sovereignAgent)` read, decimal string.
        open_positions:
          type: array
          items:
            $ref: '#/components/schemas/WalletPositionDto'
          description: |-
            Unclaimed positions (amount > 0, `claimed == false`) across every market in the
            markets cache, cross-referenced via a real `getPosition` read per market. Bounded
            by the current market count — fine at this scale, would want indexing if the
            market count grows into the hundreds+.
        sovereign_agent:
          type: string
        transaction_history:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/TransactionDto'
          description: |-
            Transfer/stake/payout history requires indexing on-chain events (`Transfer`,
            `PositionEntered`, `PayoutClaimed`, ...), which this pass does not build. `null`,
            never a fabricated transaction list. See `docs/wiki/entities/integrity-oracle.md`.
    XnsResolveDto:
      type: object
      required:
      - handle
      properties:
        did:
          type:
          - string
          - 'null'
          description: DID (did:integrity:<sovereign_agent>) when a reverse mapping exists in the oracle DB.
        handle:
          type: string
        sovereign_agent:
          type:
          - string
          - 'null'
          description: SovereignAgent address the handle points at, or null if unregistered.
    ZkProofDto:
      type: object
      required:
      - circuit_id
      - proof
      - public_inputs
      properties:
        circuit_id:
          type: string
        proof:
          type: string
          description: Base64-encoded raw bytes of `bb prove`'s `proof` output file.
        public_inputs:
          type: string
          description: Base64-encoded raw bytes of `bb prove`'s `public_inputs` output file.
tags:
- name: agents
  description: Agent identity, registration, and on-chain primitive resolution
- name: ais
  description: Agent Integrity Score and leaderboard
- name: telemetry
  description: Telemetry ingestion (feeds AIS computation)
- name: compliance
  description: HIPAA/Integrity Health vertical compliance status
- name: markets
  description: IntegrityMarket prediction-market reads
- name: wallet
  description: $ITK balance and open market positions
- name: audit
  description: Real, durable audit trail (BCC intercept decisions + flagged telemetry)
- name: verification
  description: Evidence-backed identity verification ladder
