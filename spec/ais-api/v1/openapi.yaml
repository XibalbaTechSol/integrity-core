          description: Average grounding (HGI) in [0,1].
        model_name:
          type: string
        provider_name:
          type: string
        sample_count:
          type: integer
          format: int64
        simulated_ais:
          type: integer
          format: int64
          description: Simulated AIS on the 0-1000 scale from this model's stability + grounding.
        stability_metric:
          type: number
          format: double
          description: Behavioral stability in [0,1] = exp(-1.5 * avg_variance^2) (mirrors the entropy score).
