name: CI

# Mirrors the root Makefile's `test` target, split into one job per package so a
# failure in one toolchain doesn't hide results from the others (see Makefile / README
# "Local development"). `test-e2e` (Playwright, needs a full booted stack) and `demo`
# (live Base Sepolia) are deliberately NOT run here — see docs/TESTING.md for why they're
# a separate, slower layer.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# CI only reads source and publishes test results. Keep the default token
# incapable of changing repository contents, pull requests, or workflows.
permissions:
  contents: read

concurrency:
  group: integrity-core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_VERSION: v1.7.1
  RUST_VERSION: "1.96.0"
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.x"

jobs:
  contracts:
    name: contracts (forge test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      # Retried WITH a cache clean between attempts: EINTEGRITY on @ethersproject/solidity
      # has been observed, and a bare retry doesn't help -- all 3 naive attempts failed on
      # the byte-for-byte IDENTICAL wrong hash, which means npm's own local package cache
      # on the runner was serving one bad cached tarball, not re-fetching from the registry
      # at all after the first miss. `npm cache clean --force` forces that re-fetch.
      - run: npm install || (npm cache clean --force && npm install) || (npm cache clean --force && npm install)
        working-directory: contracts
      - run: forge test -vvv
        working-directory: contracts

  oracle:
    name: integrity-oracle (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: integrity-oracle
      # Real-toolchain (ORACLE_E2E=1) tests need Postgres/Redis/anvil/forge and are NOT
      # run here — this job runs `cargo test --workspace --lib` plus the e2e test
      # binary's default (skip-logging) path, matching what a bare `cargo test` does
      # without ORACLE_E2E set. See backend/tests/e2e.rs's own doc comment.
      - run: cargo test --workspace
        working-directory: integrity-oracle

  sdk:
    name: integrity-sdk (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      # Retried WITH a cache clean between attempts: EINTEGRITY on @ethersproject/solidity
      # has been observed, and a bare retry doesn't help -- all 3 naive attempts failed on
      # the byte-for-byte IDENTICAL wrong hash, which means npm's own local package cache
      # on the runner was serving one bad cached tarball, not re-fetching from the registry
      # at all after the first miss. `npm cache clean --force` forces that re-fetch.
      - run: npm install || (npm cache clean --force && npm install) || (npm cache clean --force && npm install)
        working-directory: contracts
      # The SDK core's OPA client is tested against a real OPA server
      # (tests/unit/test_core_opa.py); the same pinned binary the bcc_middleware job uses.
      - name: Install OPA
        run: |
          sudo curl --fail -L -o /usr/local/bin/opa https://openpolicyagent.org/downloads/v1.18.2/opa_linux_amd64_static
          sudo chmod +x /usr/local/bin/opa
      # mlflow is an opt-in extra (842371c); install it so the MLflow tracing
      # tests keep running in CI.
      - run: uv sync --extra mlflow
        working-directory: integrity-sdk
      - run: uv run pytest
        working-directory: integrity-sdk

  cli:
    name: integrity-cli (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      # Retried WITH a cache clean between attempts: EINTEGRITY on @ethersproject/solidity
      # has been observed, and a bare retry doesn't help -- all 3 naive attempts failed on
      # the byte-for-byte IDENTICAL wrong hash, which means npm's own local package cache
      # on the runner was serving one bad cached tarball, not re-fetching from the registry
      # at all after the first miss. `npm cache clean --force` forces that re-fetch.
      - run: npm install || (npm cache clean --force && npm install) || (npm cache clean --force && npm install)
        working-directory: contracts
      - run: uv sync
        working-directory: integrity-cli
      - run: uv run pytest
        working-directory: integrity-cli

  bcc_middleware:
    name: bcc_middleware (pytest + opa test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: Install OPA
        run: |
          sudo curl --fail -L -o /usr/local/bin/opa https://openpolicyagent.org/downloads/v1.18.2/opa_linux_amd64_static
          sudo chmod +x /usr/local/bin/opa
      - run: uv sync
        working-directory: bcc_middleware
      - run: uv run pytest
        working-directory: bcc_middleware
      - run: opa test policies/ -v
        working-directory: bcc_middleware

  # Jules dispatch is intentionally removed from repository CI. The malformed
  # direct API request previously used here created an untracked second control
  # plane and could not provide durable session/PR linkage. The local bounded
  # controller is the sole dispatcher and runs in canary mode with explicit
  # risk and branch gates:
  #   /home/xibalba/Projects/xibalba-agents/ops/jules-loop/
  # GitHub CI remains the verifier; it does not create agents or merge PRs.
